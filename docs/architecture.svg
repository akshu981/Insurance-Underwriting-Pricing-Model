<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 40 600 460" width="600" height="460" role="img">
<title>MLOps architecture: Local PC, Docker, GitHub, and AWS</title>
<desc>JupyterLab and a local Git repo run on the Local PC; commits are pushed to GitHub. Docker Desktop simulates SageMaker Processing and Training jobs locally, reading and writing an S3 bucket in AWS, authenticated through an IAM role.</desc>
<style>
  text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:600}
  .ts{font-size:12px}
  .lab{font-size:12px;fill:#73726c}
  rect{stroke-width:0.5}
  .ln{fill:none;stroke:#73726c;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-dasharray:4 3}
  .c-blue rect{fill:#E6F1FB;stroke:#185FA5} .c-blue .th{fill:#0C447C} .c-blue .ts{fill:#185FA5}
  .c-teal rect{fill:#E1F5EE;stroke:#0F6E56} .c-teal .th{fill:#085041} .c-teal .ts{fill:#0F6E56}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D} .c-coral .th{fill:#712B13} .c-coral .ts{fill:#993C1D}
  .c-amber rect{fill:#FAEEDA;stroke:#854F0B} .c-amber .th{fill:#633806} .c-amber .ts{fill:#854F0B}
  .c-gray rect{fill:#F1EFE8;stroke:#5F5E5A} .c-gray .th{fill:#444441} .c-gray .ts{fill:#5F5E5A}
  @media (prefers-color-scheme: dark){
    .lab{fill:#9c9a92}
    .ln{stroke:#9c9a92}
    .c-blue rect{fill:#0C447C;stroke:#85B7EB} .c-blue .th{fill:#B5D4F4} .c-blue .ts{fill:#85B7EB}
    .c-teal rect{fill:#085041;stroke:#5DCAA5} .c-teal .th{fill:#9FE1CB} .c-teal .ts{fill:#5DCAA5}
    .c-coral rect{fill:#712B13;stroke:#F0997B} .c-coral .th{fill:#F5C4B3} .c-coral .ts{fill:#F0997B}
    .c-amber rect{fill:#633806;stroke:#EF9F27} .c-amber .th{fill:#FAC775} .c-amber .ts{fill:#EF9F27}
    .c-gray rect{fill:#444441;stroke:#B4B2A9} .c-gray .th{fill:#D3D1C7} .c-gray .ts{fill:#B4B2A9}
  }
</style>
<g class="c-blue">
  <rect x="40" y="60" width="360" height="260" rx="20"/>
  <text class="th" x="60" y="82" dominant-baseline="central">Local PC</text>
</g>
<g class="c-teal">
  <rect x="60" y="95" width="130" height="56" rx="8"/>
  <text class="th" x="125.0" y="113" text-anchor="middle" dominant-baseline="central">JupyterLab</text>
  <text class="ts" x="125.0" y="133" text-anchor="middle" dominant-baseline="central">Edit code</text>
</g>
<g class="c-teal">
  <rect x="250" y="95" width="130" height="56" rx="8"/>
  <text class="th" x="315.0" y="113" text-anchor="middle" dominant-baseline="central">Local Git Repo</text>
  <text class="ts" x="315.0" y="133" text-anchor="middle" dominant-baseline="central">commit history</text>
</g>
<g class="c-amber">
  <rect x="60" y="185" width="320" height="100" rx="8"/>
  <text class="th" x="220.0" y="215" text-anchor="middle" dominant-baseline="central">Docker Desktop</text>
  <text class="ts" x="220.0" y="238" text-anchor="middle" dominant-baseline="central">Simulates SageMaker jobs (local mode)</text>
  <text class="ts" x="220.0" y="256" text-anchor="middle" dominant-baseline="central">Processing + Training (GLM, XGBoost)</text>
</g>
<g class="c-coral">
  <rect x="440" y="95" width="160" height="56" rx="8"/>
  <text class="th" x="520.0" y="113" text-anchor="middle" dominant-baseline="central">GitHub</text>
  <text class="ts" x="520.0" y="133" text-anchor="middle" dominant-baseline="central">Remote backup</text>
</g>
<g class="c-gray">
  <rect x="440" y="200" width="160" height="56" rx="8"/>
  <text class="th" x="520.0" y="218" text-anchor="middle" dominant-baseline="central">IAM Role</text>
  <text class="ts" x="520.0" y="238" text-anchor="middle" dominant-baseline="central">Grants permissions</text>
</g>
<g class="c-blue">
  <rect x="40" y="350" width="560" height="130" rx="20"/>
  <text class="th" x="60" y="372" dominant-baseline="central">AWS</text>
</g>
<g class="c-gray">
  <rect x="60" y="385" width="250" height="70" rx="8"/>
  <text class="th" x="185.0" y="408" text-anchor="middle" dominant-baseline="central">S3 Bucket</text>
  <text class="ts" x="185.0" y="428" text-anchor="middle" dominant-baseline="central">raw/ &#8594; processed/ &#8594; models/</text>
</g>
  <line class="ln" x1="190" y1="123" x2="248" y2="123"/>
  <path class="ln" d="M241.0 127.0 L248 123 L241.0 119.0"/>
  <line class="ln" x1="380" y1="123" x2="438" y2="123"/>
  <path class="ln" d="M431.0 127.0 L438 123 L431.0 119.0"/>
  <line class="ln" x1="125" y1="151" x2="125" y2="183"/>
  <path class="ln" d="M121.0 176.0 L125 183 L129.0 176.0"/>
  <line class="ln dash" x1="380" y1="212" x2="438" y2="220"/>
  <path class="ln" d="M430.5 223.0 L438 220 L431.6 215.1"/>
  <line class="ln" x1="220" y1="285" x2="200" y2="383"/>
  <path class="ln" d="M197.5 375.3 L200 383 L205.3 376.9"/>
  <line class="ln dash" x1="440" y1="238" x2="310" y2="415"/>
  <path class="ln" d="M310.9 407.0 L310 415 L317.4 411.7"/>
<text class="lab" x="219" y="114" text-anchor="middle">commit</text>
<text class="lab" x="419" y="114" text-anchor="middle">push</text>
<text class="lab" x="419" y="196" text-anchor="middle">auth</text>
<text class="lab" x="262" y="337" text-anchor="middle">reads / writes</text>
<text class="lab" x="408" y="332">grants access</text>
</svg>
