name: CI and promotion gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install numpy pandas scipy pytest

      - name: Syntax-check pipeline scripts
        run: python -m compileall -q code

      - name: Run unit tests
        run: pytest -q

  promotion-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Evaluate challenger against promotion rules
        run: python code/model_gate.py docs/model_metrics.json